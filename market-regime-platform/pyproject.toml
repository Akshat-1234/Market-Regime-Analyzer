[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-regime-backtester"
version = "0.1.0"
description = "Causal walk-forward market regime research and backtesting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2", "hmmlearn>=0.3.3,<0.4", "matplotlib>=3.7,<4",
  "PyYAML>=6.0,<7", "threadpoolctl>=3.1,<4", "tzdata>=2024.1"
]

[project.optional-dependencies]
download = ["yfinance>=0.2.54,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
dashboard = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1"]

[project.scripts]
regime-bt = "regime_backtester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::RuntimeWarning"]
