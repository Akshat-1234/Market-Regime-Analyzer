data:
  csv: /home/user/nifty_external_test.csv
  date_column: Date
  price_column: Close
walkforward:
  min_train_days: 504
  max_train_days: null
  start_date: null
  end_date: null
hmm:
  primary_model: rvd_3
  covariance_type: diag
  n_iter: 250
  tol: 0.05
  min_covar: 0.001
  min_state_fraction: 0.02
  seeds:
  - 2
  - 42
  target_volatility: 0.12
  volatility_floor: 0.03
  models:
  - name: rv_2
    n_states: 2
    features:
    - daily_return
    - volatility_20
  - name: rv_3
    n_states: 3
    features:
    - daily_return
    - volatility_20
  - name: rvd_2
    n_states: 2
    features:
    - daily_return
    - volatility_20
    - drawdown_252
  - name: rvd_3
    n_states: 3
    features:
    - daily_return
    - volatility_20
    - drawdown_252
backtest:
  initial_capital: 1000.0
  annual_risk_free_rate: 0.065
  trading_days_per_year: 252
  transaction_cost_bps: 10.0
  execution_delay_sessions: 0
  trend_weight_in_blend: 0.5
  trend_window: 50
  momentum_window: 20
  mean_reversion_window: 20
  mean_reversion_entry_band: 0.02
  vol_target: 0.12
bootstrap:
  samples: 1000
  block_length: 20
  seed: 42
  confidence: 0.95
output:
  directory: results/external_nifty_snapshot
